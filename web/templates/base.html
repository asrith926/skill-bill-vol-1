<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skill Bill{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0d0f'/%3E%3Cpath d='M16 6l10 10-10 10L6 16z' fill='%23f0b429'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,300;1,6..72,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/typography.css">
    <link rel="stylesheet" href="/static/css/animations.css">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Noise texture overlay -->
    <div class="noise-overlay" aria-hidden="true"></div>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-brand">
                <span class="nav-brand-icon">&#9670;</span>
                <span class="nav-brand-text">Skill Bill</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">Generate</a>
                <a href="/library" class="nav-link">Library</a>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-inner">
            <span class="footer-text">Skill Bill Pipeline</span>
            <span class="footer-sep">&#183;</span>
            <span class="footer-text">YouTube &rarr; Structured Knowledge</span>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
